name: Mac

on:
  push:
    branches: [main, mac-surumu]
  pull_request:
  workflow_dispatch:

# Ayni dala yeni gonderim gelince eski Mac calismasi iptal edilir (Mac makineleri sinirli).
concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  motor:
    strategy:
      fail-fast: false
      matrix:
        # Apple Silicon ve Intel Mac.
        os: [macos-26, macos-26-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Basarisiz testlerin ozeti uyari (annotation) olarak da yazilir: gunlugu okumak
      # oturum ister, uyarilar herkese acik API'den okunur.
      - name: Testler (proxy motoru, sifreli DNS, Mac hizmeti)
        shell: bash
        run: |
          set -o pipefail
          if ! cargo test -p proxy -p dnsclient -p macservice -p shared 2>&1 | tee test.log; then
            { sed -n '/^failures:$/,/^test result/p' test.log; grep -E -A8 '^error(\[|:)' test.log; } | head -80 > fail.txt
            echo "::error title=Testler basarisiz::$(sed -e 's/%/%25/g' -e 's/\r//g' fail.txt | awk 'BEGIN { ORS = "%0A" } { print }')"
            exit 1
          fi
      - name: Gercek agda deneme
        run: |
          cargo build --release -p proxy --bin dpi-proxy
          bash perf/proxy-smoke.sh target/release/dpi-proxy perf/out/proxy-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proxy-smoke-${{ matrix.os }}
          path: perf/out/proxy-smoke

  # Sistem proxy'si (PAC), URLSession ve ekran goruntusu: gercek macOS entegrasyonu.
  sistem:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Sistem entegrasyonu
        run: |
          cargo build --release -p proxy --bin dpi-proxy
          bash perf/mac-system-test.sh target/release/dpi-proxy perf/out/mac-system
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-system
          path: perf/out/mac-system

  # Mac uygulamasi: .app + .dmg paketi, gercek macOS'ta acilis, ekran goruntuleri, cikis.
  uygulama:
    runs-on: macos-26
    # Denemelerde hizli derleme (LTO kapali); yayin paketi tam iyilestirmeyle mac-release.yml'de.
    env:
      CARGO_PROFILE_RELEASE_LTO: "off"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Paket (.app ve .dmg)
        run: bash installer/mac/package.sh
      - name: Uygulamayi ac ve dene
        env:
          FONT_TRIALS: ".AppleSystemUIFont;Helvetica Neue;Lucida Grande;Avenir Next;SF Pro Text;Helvetica"
        run: bash perf/mac-app-test.sh "build/mac/DPI UI.app" perf/out/mac-app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-app
          path: perf/out/mac-app
      - uses: actions/upload-artifact@v4
        with:
          name: DPI-UI-Mac
          path: build/DPI-UI-Mac.dmg
