name: Mac

on:
  push:
    branches: [main, mac-surumu]
  pull_request:
  workflow_dispatch:

jobs:
  motor:
    strategy:
      fail-fast: false
      matrix:
        # Apple Silicon ve Intel Mac.
        os: [macos-26, macos-26-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Basarisiz testlerin ozeti uyari (annotation) olarak da yazilir: gunlugu okumak
      # oturum ister, uyarilar herkese acik API'den okunur.
      - name: Testler (proxy motoru, sifreli DNS)
        shell: bash
        run: |
          set -o pipefail
          if ! cargo test -p proxy -p dnsclient 2>&1 | tee test.log; then
            { sed -n '/^failures:$/,/^test result/p' test.log; grep -E -A8 '^error(\[|:)' test.log; } | head -80 > fail.txt
            echo "::error title=Testler basarisiz::$(sed -e 's/%/%25/g' -e 's/\r//g' fail.txt | awk 'BEGIN { ORS = "%0A" } { print }')"
            exit 1
          fi
      - name: Gercek agda deneme
        run: |
          cargo build --release -p proxy --bin dpi-proxy
          bash perf/proxy-smoke.sh target/release/dpi-proxy perf/out/proxy-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proxy-smoke-${{ matrix.os }}
          path: perf/out/proxy-smoke

  # Sistem proxy'si (PAC), URLSession ve ekran goruntusu: gercek macOS entegrasyonu.
  sistem:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Sistem entegrasyonu
        run: |
          cargo build --release -p proxy --bin dpi-proxy
          bash perf/mac-system-test.sh target/release/dpi-proxy perf/out/mac-system
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-system
          path: perf/out/mac-system
