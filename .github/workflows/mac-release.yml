name: Mac yayini

# Mac paketini (DPI-UI-Mac.dmg) tam iyilestirmeyle derleyip GitHub yayinina ekler.
# - Mac etiketi gonderilince (or. v3.1.2-mac.1): yayin yoksa on surum olarak olusturulur.
#   Windows guncelleyicisi on surumleri ve Windows dosyasi olmayan yayinlari hic gormez; Mac
#   guncelleyicisi de kararli surumdeyken on surum onermez.
# - Bir yayin yayimlaninca (release.ps1) Mac paketi o yayina da eklenir.
# Imza anahtari GitHub'da degil: paketin imzali manifestini (update-mac.json) yayin yapan
# bilgisayar release-mac.ps1 ile ekler; uygulama ancak ondan sonra kendiliginden kurar.
on:
  push:
    tags: ["v*-mac.*"]
  release:
    types: [published]

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Paket
        run: bash installer/mac/package.sh
      - name: Yayina ekle
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "DPI UI ${TAG#v} (Mac)" --notes-file installer/mac/RELEASE_NOTES.md
          fi
          gh release upload "$TAG" build/DPI-UI-Mac.dmg build/DPI-UI-Mac.zip --clobber
