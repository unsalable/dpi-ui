name: Android

# Android paketinin derlenebildigini denetler ve hata ayiklama APK'sini (arm64 + x86_64) ek olarak
# birakir. Yayin paketi imza anahtari gerektirdigi icin yayin yapan bilgisayarda derlenir
# (release-android.ps1).
on:
  push:
    branches: [main, mac-surumu, android-surumu]
  pull_request:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - name: cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Rust kutuphanesi (libdpiui.so)
        run: |
          # GitHub'in makinesinde NDK'lar ANDROID_HOME/ndk altinda; en yenisi bu degiskende.
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)}"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          # Slint'in Java yardimcisi derlenirken android.jar gerekir; platform klasoru adlari
          # (android-36.1 gibi) kendi aramasini sasirtiyor, yol acikca verilir.
          export ANDROID_JAR="$(ls -d "$ANDROID_HOME"/platforms/android-* | sort -V | tail -1)/android.jar"
          echo "NDK: $ANDROID_NDK_HOME, android.jar: $ANDROID_JAR"
          cargo ndk -t arm64-v8a -t x86_64 -o target/android-out build -p dpi-ui-mobile
          for abi in arm64-v8a x86_64; do
            mkdir -p apps/android/app/src/main/jniLibs/$abi
            cp target/android-out/$abi/libdpiui.so apps/android/app/src/main/jniLibs/$abi/
          done
      - name: APK
        working-directory: apps/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: DPI-UI-Android-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
