[package]
name = "shared"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Servis ve arayuzun ortak dili: ayar semasi, DNS hazirlari, IPC mesajlari, v1 gocu"

[dependencies]
engine = { path = "../engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
