[package]
name = "macservice"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Mac'te motor hizmeti: proxy motorunu, PAC dosyasini ve sistem proxy ayarini yonetir; arayuzle Windows servisiyle ayni protokolu konusur"

[dependencies]
dnsclient = { path = "../dnsclient" }
engine = { path = "../engine" }
proxy = { path = "../proxy" }
shared = { path = "../shared" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ring = "0.17.14"
