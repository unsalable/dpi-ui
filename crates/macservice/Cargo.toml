[package]
name = "macservice"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Mac'te motor hizmeti: proxy motorunu, PAC dosyasini ve sistem proxy ayarini yonetir; arayuzle Windows servisiyle ayni protokolu konusur"

[dependencies]
dnsclient = { path = "../dnsclient" }
engine = { path = "../engine" }
proxy = { path = "../proxy" }
shared = { path = "../shared" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ring = "0.17.14"
# Uygulama ici HTTPS istemcisi (Android'de curl yok); dnsclient'la ayni surumler.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1.0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"
