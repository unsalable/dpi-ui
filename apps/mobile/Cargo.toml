[package]
name = "dpi-ui-mobile"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "DPI UI'nin Android surumu: masaustuyle ayni Slint arayuzu, uygulama ici motor, VPN ile trafigi yerel proxy'ye getiren katman"

# Android'in yukledigi kutuphane: libdpiui.so (NativeActivity ve VPN hizmeti ayni dosyayi kullanir).
[lib]
name = "dpiui"
crate-type = ["cdylib", "rlib"]

[dependencies]
shared = { path = "../../crates/shared" }
engine = { path = "../../crates/engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Bilgisayarda (testler) yazilim cizicisi; telefonda Slint'in Android katmani (Skia).
slint = { version = "1.18.1", default-features = false, features = ["std", "compat-1-2", "renderer-software"] }

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-android-activity-06"] }
macservice = { path = "../../crates/macservice" }
proxy = { path = "../../crates/proxy" }
jni = "0.22.4"
# VPN arayuzundeki paketleri TCP/UDP akislarina cevirip yerel proxy'ye (SOCKS5) verir.
tun2proxy = { version = "0.8.7", default-features = false }
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread"] }
log = "0.4"

[build-dependencies]
slint-build = "1.18.1"
