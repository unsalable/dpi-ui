[package]
name = "goodbyedpi3-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "GoodbyeDPI3"
path = "src/main.rs"

[dependencies]
engine = { path = "../../crates/engine" }
shared = { path = "../../crates/shared" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Yalnizca winit + yazilim render: GPU yigini (OpenGL/Skia) hic yuklenmez.
slint = { version = "1.18.1", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-software",
    "unstable-winit-030",
] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# Mac: motor uygulamanin icinde (macservice), menu cubugu simgesi (tray-icon), Dock ve
# kapanis bildirimleri (objc2), uygulama simgesi icin PNG.
[target.'cfg(target_os = "macos")'.dependencies]
macservice = { path = "../../crates/macservice" }
proxy = { path = "../../crates/proxy", default-features = false }
tray-icon = "0.26.1"
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", features = ["NSNotification", "NSString", "NSOperation", "block2"] }
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSRunningApplication"] }
block2 = "0.6.2"
png = "0.18.1"

[build-dependencies]
slint-build = "1.18.1"
winresource = "0.1.34"
