[workspace]
resolver = "3"
members = ["apps/service", "apps/ui", "crates/dnsclient", "crates/engine", "crates/proxy", "crates/shared", "crates/windivert", "tools/release"]

[workspace.package]
version = "3.1.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/unsalable/dpi-ui"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
# Motor paket basina catch_unwind ile korunuyor; unwind kalmali.
panic = "unwind"

